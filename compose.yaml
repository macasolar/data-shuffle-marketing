# One service, run on demand by whatever dispatches the work:
#   docker compose run --rm ds run week
# Nothing stays up between runs. Only this repo is mounted (CLAUDE.md rule 0).
# See docs/SERVER.md.
services:
  ds:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
    image: ds-marketing
    env_file: .env
    environment:
      CLAUDE_CONFIG_DIR: /home/ds/.claude
    volumes:
      - .:/app
      # Claude login, Metricool's OAuth token and the workspace trust live here.
      - claude-home:/home/ds/.claude

volumes:
  claude-home:
