[project]
name = "ds-marketing"
# version.txt is the only place the version lives; .githooks/pre-commit bumps it.
dynamic = ["version"]
description = "Content and social media automation for Data-Shuffle"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2",
    "pyyaml>=6",
    # zoneinfo data for America/Panama; slim images ship without the system tz database.
    "tzdata",
]

[project.scripts]
ds = "ds.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "version.txt"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["ds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture pieces are copied verbatim from real content, long lines included.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
